name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            l3build
            latex
            latex-bin
            enumitem
            etoolbox
            datetime2
            datetime2-english
            tracklang
            hyperref
            imakeidx
            lm

      - name: Build package
        run: l3build unpack

      - name: Run tests
        run: l3build check

      - name: Build documentation
        run: l3build doc
