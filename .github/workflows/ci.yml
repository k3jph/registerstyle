name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            l3build
            latex
            latex-bin
            tools
            l3packages
            enumitem
            etoolbox
            datetime2
            datetime2-english
            tracklang
            hyperref
            imakeidx
            lm

      - name: Build package
        run: l3build unpack

      - name: Run tests
        run: l3build check

      - name: Show test diffs
        if: failure()
        run: |
          cat build/test/*.diff 2>/dev/null || true
          echo "=== Raw log (basic, last 80 lines) ==="
          tail -80 build/test/basic.log 2>/dev/null || true
          echo "=== Checking key packages ==="
          kpsewhich xspace.sty xparse.sty regression-test.tex 2>&1 || true
          echo "=== Normalized log (basic) ==="
          cat build/test/basic.pdftex.log 2>/dev/null || true

      - name: Build documentation
        run: l3build doc
